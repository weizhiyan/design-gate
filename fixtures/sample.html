<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>实现页面（含故意偏差）</title>
<style>
  /* 设计意图: 320 宽白卡、radius16、主色按钮。此处埋入典型实现偏差用于冒烟测试 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #f6f7f9; font-family: "PingFang SC", sans-serif; }
  body { padding: 80px 100px; }
  .pricing-card {
    position: relative;
    width: 310px;              /* 偏差: 设计 320 → 几何 error */
    height: 340px;
    background: #ffffff;
    border-radius: 16px;
    padding: 24px 24px 24px 25px;  /* 偏差: 左内边距 25 —— 容差之内(1px<2)、标尺之外(25∉4/8) → 只出栅格结论 */
    box-shadow: 0 4px 12px rgba(0,0,0,.06);
  }
  .card-title { font-size: 15px; font-weight: 600; line-height: 28px; color: #111827; }   /* 偏差: 字号 20→15 error */
  .price { margin-top: 12px; font-size: 30px; font-weight: 700; line-height: 40px; color: #2563eb; } /* 偏差: 32→30 error */
  .desc { margin-top: 12px; font-size: 14px; line-height: 20px; color: #9ca3af; }          /* 偏差: 色值错 + 硬编码 token error */
  .divider { margin-top: 12px; height: 1px; border: none; background: #e5e7eb; }
  .feats { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }           /* 偏差: gap 12→10 —— 出几何结论；同一数值的栅格结论按设计被抑制 */
  .feat { font-size: 14px; line-height: 24px; color: #111827; }
  .btn {
    display: block; width: 100%; height: 44px; margin-top: 16px;
    background: #2536eb;       /* 偏差: 主色写错一位 → 颜色警告 + token error */
    color: #fff; font-size: 16px; font-weight: 500; font-family: inherit;
    border: none; border-radius: 6px;   /* 偏差: 圆角 8→6 */
  }
  .badge {                   /* 偏差: 设计稿中不存在的元素 */
    position: absolute; top: -10px; right: -10px;
    background: #ef4444; color: #fff; font-size: 12px;
    padding: 4px 10px; border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="pricing-card" data-df-id="1:2">
    <span class="badge">限时优惠</span>
    <h2 class="card-title">专业版</h2>
    <div class="price">¥99 /月</div>
    <p class="desc">适合5-10人团队使用</p>
    <hr class="divider">
    <div class="feats">
      <div class="feat">✓ 无限项目</div>
      <div class="feat">✓ 无限成员</div>
      <!-- 缺失: ✓ 优先支持 -->
    </div>
    <button class="btn">立即购买</button>
  </div>
</body>
</html>
